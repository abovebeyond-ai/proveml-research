<!doctype html><html lang="en"><head><meta charset="utf-8"><style>

:where(.proveml-root) {
    --proveml-entity-color: #0d9488;
    --proveml-inference-color: #7c3aed;
    --proveml-danger-color: #dc2626;
    --proveml-warning-color: #d97706;
    --proveml-proof-color: #6b7280;
    --proveml-entity-hover-bg: rgba(13, 148, 136, 0.06);
    --proveml-fact-hover-bg: rgba(13, 148, 136, 0.08);
    --proveml-inference-hover-bg: rgba(124, 58, 237, 0.06);
    --proveml-highlight-bg: rgba(13, 148, 136, 0.08);
    --proveml-highlight-outline: rgba(13, 148, 136, 0.2);
    --proveml-paragraph-gap: 0.75rem;
}
.proveml-paragraph {
    margin: 0;
}
.proveml-paragraph + .proveml-paragraph {
    margin-top: var(--proveml-paragraph-gap);
}
.proveml-entity {
    border-bottom: 1.5px solid var(--entity-color, var(--proveml-entity-color));
    padding-bottom: 1px;
    cursor: help;
    transition: background-color 0.15s ease;
}
.proveml-entity:hover {
    background-color: var(--proveml-entity-hover-bg);
}
.proveml-entity.proveml-name-mismatch {
    border-bottom-style: wavy;
    border-bottom-color: var(--proveml-danger-color);
}
.proveml-entity.proveml-ambiguous {
    border-bottom-style: double;
    border-bottom-color: var(--proveml-warning-color);
}
.proveml-entity.proveml-unverifiable {
    border-bottom-style: dashed;
    border-bottom-color: var(--proveml-warning-color);
}
.proveml-fact {
    font-weight: 600;
    cursor: help;
    transition: background-color 0.15s ease;
}
.proveml-fact.proveml-verified {
    border-bottom: 1.5px dotted var(--entity-color, var(--proveml-entity-color));
}
.proveml-fact.proveml-verified:hover {
    background-color: var(--proveml-fact-hover-bg);
}
.proveml-fact.proveml-mismatch {
    border-bottom: 1.5px dotted var(--proveml-danger-color);
    color: var(--proveml-danger-color);
    text-decoration: line-through;
    text-decoration-color: rgba(220, 38, 38, 0.3);
}
.proveml-fact.proveml-unverifiable,
.proveml-fact.proveml-no-context {
    border-bottom: 1.5px dotted var(--proveml-warning-color);
    color: var(--proveml-warning-color);
}
.proveml-inference {
    cursor: help;
    transition: background-color 0.15s ease;
}
.proveml-inference.proveml-verified {
    border-bottom: 1.5px dashed var(--proveml-inference-color);
}
.proveml-inference.proveml-verified:hover {
    background-color: var(--proveml-inference-hover-bg);
}
.proveml-inference.proveml-failed {
    border-bottom: 1.5px dashed var(--proveml-danger-color);
    color: var(--proveml-danger-color);
}
.proveml-proof {
    margin-left: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.62em;
    color: var(--proveml-proof-color);
    white-space: nowrap;
}
.proveml-entity-highlight {
    background-color: var(--proveml-highlight-bg) !important;
    outline: 1px solid var(--proveml-highlight-outline);
    border-radius: 2px;
    transition: background-color 0.1s ease;
}

@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Spline+Sans+Mono:wght@400;500&display=swap');
:root { --ink:#0e2433; --muted:#47616f; --haze-line:rgba(14,36,51,.18); --card:#fafcfd; --tint:#dfe8eb;
  --mark-ok:#126b3a; --mark-ok-lijn:rgba(18,107,58,.5); --mark-inf:#0e5730; --mark-inf-vlak:rgba(18,107,58,.14);
  --mark-bad:#dc2626; --mark-bad-lijn:rgba(220,38,38,.35); --mark-unk:#d97706; --accent:#1a4fb4;
  --pv-fact:#0d9488; --pv-inf:#7c3aed; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); font-family:Lato, system-ui, sans-serif; }
.page { width:1180px; padding:34px 40px 30px; }
figcaption { font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:15px; letter-spacing:.04em; color:var(--muted); margin:0 0 14px; }
.out { font-size:29px; line-height:1.95; max-width:1100px; }
.out p { margin:0 0 14px; }
.verdict { margin-top:18px; padding-top:12px; border-top:1px solid var(--haze-line); font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:16px; color:var(--muted); }
.verdict b { color:var(--mark-bad); font-weight:500; } .verdict b.ok { color:var(--mark-ok); }
.proveml-root { --proveml-entity-color:var(--pv-fact); --proveml-inference-color:var(--pv-inf); --proveml-danger-color:var(--mark-bad); --proveml-warning-color:var(--mark-unk); --proveml-proof-color:var(--muted); }
.proveml-fact.proveml-mismatch { text-decoration-color:var(--mark-bad-lijn); text-decoration-thickness:1.5px; }
.proveml-proof { font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:.5em; margin-left:.35em; white-space:nowrap; vertical-align:.15em; }
/* the display figure */
.rows { display:grid; grid-template-columns:200px 1fr; row-gap:22px; column-gap:22px; align-items:start; }
.rows .k { font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding-top:10px; }
.src { margin:0; font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:21px; line-height:1.7; background:var(--card); border:1px solid var(--haze-line); border-radius:4px; padding:12px 16px; white-space:pre-wrap; }
.src i { font-style:normal; color:var(--accent); }
.audit { font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:17px; color:var(--muted); line-height:1.7; }
</style></head><body><div class="page"><figure style="margin:0"><div class="out proveml-root"><div class="proveml-root"><p class="proveml-paragraph"><span class="proveml-entity proveml-verified proveml-trust-unverified" data-entity="company:aapl" data-subject-unique="true" data-trust-status="unverified" data-trust-backend="plain" title="company:aapl.name">Apple Inc.</span> reported revenue of <span class="proveml-fact proveml-verified proveml-trust-unverified" data-entity="company:aapl" data-path="company:aapl.revenue" data-value="391035000000 USD" data-trust-status="unverified" data-trust-backend="plain" title="company:aapl.revenue = 391035000000 USD (shown as $391.0 billion)">$391.0 billion</span> with net income of <span class="proveml-fact proveml-verified proveml-trust-unverified" data-entity="company:aapl" data-path="company:aapl.netIncome" data-value="93736000000 USD" data-trust-status="unverified" data-trust-backend="plain" title="company:aapl.netIncome = 93736000000 USD (shown as $93.7 billion)">$93.7 billion</span> and earnings per share of <span class="proveml-fact proveml-verified proveml-trust-unverified" data-entity="company:aapl" data-path="company:aapl.eps" data-value="6.08 USD/shares" data-trust-status="unverified" data-trust-backend="plain" title="company:aapl.eps = 6.08 USD/shares">6.08 USD/shares</span>.</p><p class="proveml-paragraph"><span class="proveml-entity proveml-verified proveml-trust-unverified" data-entity="company:msft" data-subject-unique="true" data-trust-status="unverified" data-trust-backend="plain" title="company:msft.name">Microsoft Corporation</span> reported revenue of <span class="proveml-fact proveml-verified proveml-trust-unverified" data-entity="company:msft" data-path="company:msft.revenue" data-value="245122000000 USD" data-trust-status="unverified" data-trust-backend="plain" title="company:msft.revenue = 245122000000 USD (shown as $245.1 billion)">$245.1 billion</span> with total assets of <span class="proveml-fact proveml-verified proveml-trust-unverified" data-entity="company:msft" data-path="company:msft.assets" data-value="512163000000 USD" data-trust-status="unverified" data-trust-backend="plain" title="company:msft.assets = 512163000000 USD (shown as $512.2 billion)">$512.2 billion</span>. Its long-term debt of <span class="proveml-fact proveml-unverifiable" data-entity="company:msft" data-path="company:msft.longTermDebt" data-value="42688000000 USD" title="company:msft.longTermDebt: not found">42688000000 USD</span> yields a debt-to-equity ratio of <span class="proveml-fact proveml-mismatch proveml-trust-unverified" data-entity="company:msft" data-path="company:msft.debtToEquity" data-value="1.23" data-trust-status="unverified" data-trust-backend="plain" title="company:msft.debtToEquity: expected 0.16">1.23</span>.</p></div></div></figure></div></body></html>
